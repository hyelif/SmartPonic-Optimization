workflows:
  ios-testing:
    name: iOS Testing Build (AltStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    working_directory: flutter_app
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS debug (unsigned, for AltStore resigning)
        script: |
          flutter build ios --debug --no-codesign
      - name: Package as .ipa for AltStore sideloading
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r --symlinks SmartponicV2.ipa Payload/
          rm -rf Payload
    artifacts:
      - SmartponicV2.ipa
      - build/ios/iphoneos/Runner.app.dSYM.zip
    publishing:
      email: {}